<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار النظام | Codex POS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .info { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار نظام Codex POS</h1>
        
        <div class="test-section">
            <h2>1. اختبار حالة الخادم</h2>
            <button onclick="testServerHealth()">فحص الخادم</button>
            <div id="server-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>2. اختبار تسجيل الدخول</h2>
            <button onclick="testLogin('admin', 'Admin@123')">تسجيل دخول Admin</button>
            <button onclick="testLogin('manager', 'Admin@123')">تسجيل دخول Manager</button>
            <button onclick="testLogin('cashier', 'Admin@123')">تسجيل دخول Cashier</button>
            <div id="login-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>3. اختبار الـ APIs</h2>
            <button onclick="testAPI('categories')">اختبار الفئات</button>
            <button onclick="testAPI('products')">اختبار المنتجات</button>
            <button onclick="testAPI('customers')">اختبار العملاء</button>
            <div id="api-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>4. اختبار التخزين المحلي</h2>
            <button onclick="testLocalStorage()">فحص التخزين المحلي</button>
            <div id="storage-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>5. تنظيف البيانات</h2>
            <button onclick="clearSession()" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">مسح الجلسة</button>
            <div id="clear-result" class="test-result"></div>
        </div>
    </div>

    <script>
        const baseURL = 'http://localhost:4000';
        let currentToken = null;

        // Test server health
        async function testServerHealth() {
            const resultDiv = document.getElementById('server-result');
            resultDiv.innerHTML = '<div class="info">جاري فحص الخادم...</div>';
            
            try {
                const response = await fetch(`${baseURL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">✅ الخادم يعمل بشكل طبيعي<br>الحالة: ${data.status}<br>الوقت: ${data.timestamp}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ مشكلة في الخادم: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ فشل الاتصال بالخادم: ${error.message}</div>`;
            }
        }

        // Test login
        async function testLogin(username, password) {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = `<div class="info">جاري تسجيل الدخول كـ ${username}...</div>`;
            
            try {
                const response = await fetch(`${baseURL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    currentToken = data.data.token;
                    resultDiv.innerHTML = `
                        <div class="success">
                            ✅ تم تسجيل الدخول بنجاح<br>
                            المستخدم: ${data.data.user.username}<br>
                            الدور: ${data.data.user.role}<br>
                            Token: ${data.data.token.substring(0, 50)}...
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ فشل تسجيل الدخول: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ خطأ في تسجيل الدخول: ${error.message}</div>`;
            }
        }

        // Test API endpoints
        async function testAPI(endpoint) {
            const resultDiv = document.getElementById('api-result');
            
            if (!currentToken) {
                resultDiv.innerHTML = '<div class="error">❌ يجب تسجيل الدخول أولاً</div>';
                return;
            }
            
            resultDiv.innerHTML = `<div class="info">جاري اختبار API: ${endpoint}...</div>`;
            
            try {
                const response = await fetch(`${baseURL}/api/v1/${endpoint}`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            ✅ API يعمل بشكل طبيعي: ${endpoint}<br>
                            عدد العناصر: ${data.data ? data.data.length : 'غير محدد'}<br>
                            الرسالة: ${data.message}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ مشكلة في API: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ خطأ في API: ${error.message}</div>`;
            }
        }

        // Test local storage
        function testLocalStorage() {
            const resultDiv = document.getElementById('storage-result');
            
            try {
                // Test localStorage
                localStorage.setItem('test', 'value');
                const testValue = localStorage.getItem('test');
                localStorage.removeItem('test');
                
                // Check existing session data
                const token = localStorage.getItem('authToken');
                const user = localStorage.getItem('currentUser');
                
                let sessionInfo = '';
                if (token && user) {
                    const userData = JSON.parse(user);
                    sessionInfo = `<br>جلسة موجودة: ${userData.username} (${userData.role})`;
                }
                
                resultDiv.innerHTML = `
                    <div class="success">
                        ✅ التخزين المحلي يعمل بشكل طبيعي<br>
                        اختبار الكتابة/القراءة: نجح${sessionInfo}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ مشكلة في التخزين المحلي: ${error.message}</div>`;
            }
        }

        // Clear session
        function clearSession() {
            const resultDiv = document.getElementById('clear-result');
            
            try {
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                currentToken = null;
                
                resultDiv.innerHTML = '<div class="success">✅ تم مسح الجلسة بنجاح</div>';
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ فشل في مسح الجلسة: ${error.message}</div>`;
            }
        }

        // Auto-test server on load
        window.addEventListener('load', () => {
            testServerHealth();
        });
    </script>
</body>
</html>
