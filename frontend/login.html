<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Codex POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/additions.css">
    <style>
        /* Login page specific styles */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, 
                rgba(139, 92, 246, 0.1) 0%, 
                rgba(219, 39, 119, 0.1) 50%, 
                rgba(59, 130, 246, 0.1) 100%);
            padding: 20px;
        }

        .login-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            box-shadow: var(--shadow-glass);
            padding: 48px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .login-logo {
            margin-bottom: 32px;
        }

        .login-logo i {
            font-size: 64px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .login-logo h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            color: var(--text-primary);
        }

        .login-logo .gradient-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 16px;
        }

        .login-form {
            text-align: right;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            z-index: 2;
        }

        .form-control {
            width: 100%;
            padding: 16px 48px 16px 16px;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .quick-login {
            border-top: 1px solid var(--border-glass);
            padding-top: 24px;
            margin-top: 24px;
        }

        .quick-login h4 {
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .quick-login-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quick-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dark theme adjustments */
        .dark-theme .form-control {
            background: rgba(0, 0, 0, 0.2);
        }

        .dark-theme .form-control:focus {
            background: rgba(0, 0, 0, 0.3);
        }

        .dark-theme .quick-btn {
            background: rgba(0, 0, 0, 0.2);
        }

        .dark-theme .quick-btn:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 32px 24px;
                margin: 16px;
            }

            .login-logo i {
                font-size: 48px;
            }

            .login-logo h1 {
                font-size: 24px;
            }

            .quick-login-btns {
                flex-direction: column;
            }

            .quick-btn {
                min-width: auto;
            }
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: var(--shadow-glass);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            transform: translateX(100%);
            opacity: 0;
            animation: slideIn 0.3s ease forwards;
        }

        .toast.success {
            border-left: 4px solid #22c55e;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast i {
            font-size: 18px;
        }

        .toast.success i {
            color: #22c55e;
        }

        .toast.error i {
            color: #ef4444;
        }

        @keyframes slideIn {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-logo">
                <i class="fa-solid fa-gem"></i>
                <h1>Codex<span class="gradient-text">POS</span></h1>
            </div>
            
            <p class="login-subtitle">نظام إدارة الإكسسوارات ومواد التجميل</p>
            
            <div id="error-message" class="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text"></span>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fa-solid fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
            </form>
            
            <div class="quick-login">
                <h4>تسجيل دخول سريع:</h4>
                <div class="quick-login-btns">
                    <button class="quick-btn" onclick="quickLogin('admin', 'Admin@123')">
                        <i class="fa-solid fa-crown"></i><br>
                        مدير عام
                    </button>
                    <button class="quick-btn" onclick="quickLogin('manager', 'Admin@123')">
                        <i class="fa-solid fa-user-tie"></i><br>
                        مدير
                    </button>
                    <button class="quick-btn" onclick="quickLogin('cashier', 'Admin@123')">
                        <i class="fa-solid fa-cash-register"></i><br>
                        كاشير
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Authentication Manager
        class AuthManager {
            constructor() {
                this.baseURL = 'http://localhost:4000/api/v1';
                this.checkExistingSession();
            }

            // Check if user is already logged in
            checkExistingSession() {
                const token = localStorage.getItem('authToken');
                const user = localStorage.getItem('currentUser');
                
                if (token && user) {
                    // Verify token is still valid
                    this.verifyToken(token).then(isValid => {
                        if (isValid) {
                            this.redirectToMain();
                        } else {
                            this.clearSession();
                        }
                    });
                }
            }

            // Verify token validity
            async verifyToken(token) {
                try {
                    const response = await fetch(`${this.baseURL}/auth/verify`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    return response.ok;
                } catch (error) {
                    return false;
                }
            }

            // Login function
            async login(username, password) {
                try {
                    const response = await fetch(`${this.baseURL}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        // Store session data
                        localStorage.setItem('authToken', data.data.token);
                        localStorage.setItem('currentUser', JSON.stringify(data.data.user));
                        
                        // Show success message
                        this.showToast(`مرحباً ${data.data.user.full_name || data.data.user.username}!`, 'success');
                        
                        // Redirect after short delay
                        setTimeout(() => {
                            this.redirectToMain();
                        }, 1000);
                        
                        return { success: true, data: data.data };
                    } else {
                        return { success: false, message: data.message || 'خطأ في تسجيل الدخول' };
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    return { success: false, message: 'خطأ في الاتصال بالخادم' };
                }
            }

            // Clear session
            clearSession() {
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
            }

            // Redirect to main application
            redirectToMain() {
                // Add a small delay to ensure token is properly stored
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            }

            // Show toast notification
            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
                toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
                
                container.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(100%)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        // Initialize auth manager
        const authManager = new AuthManager();

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            // Hide previous errors
            errorDiv.style.display = 'none';
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري تسجيل الدخول...';
            
            try {
                const result = await authManager.login(username, password);
                
                if (!result.success) {
                    errorText.textContent = result.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorText.textContent = 'حدث خطأ غير متوقع';
                errorDiv.style.display = 'block';
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-sign-in-alt"></i> تسجيل الدخول';
            }
        });

        // Quick login function
        window.quickLogin = async function(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            
            // Trigger form submission
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        };

        // Auto-focus on username field
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').focus();
        });

        // Enter key handling
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
